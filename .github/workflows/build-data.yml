name: Build data

# Runs scripts/build_data.py on GitHub's servers and commits the results
# into data/. The script saves its progress as it goes, so a run that is
# canceled or runs out of time loses little. Every four hours the workflow
# starts again on its own and continues where the last run stopped; once
# everything is up to date for the month, those runs finish in a minute or
# two without changing anything. "Run workflow" on the Actions tab starts
# one by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

concurrency:
  group: build-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data files
        run: python scripts/build_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%d)"
          git push
